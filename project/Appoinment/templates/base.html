<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DocCare - Doctor Appointment Portal{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif; }
        .bg-medical { background: linear-gradient(135deg, #0d9488, #0284c7); }
        .btn-medical { background-color: #0d9488; color: white; }
        .btn-medical:hover { background-color: #0f766e; color: white; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Responsive Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-medical shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'landing' %}">
                <i class="bi bi-hospital me-2"></i>DocCare
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'landing' %}"><i class="bi bi-house me-1"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'book_appointment' %}"><i class="bi bi-calendar-plus me-1"></i>Book Slot</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'show_all' %}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Global Alert Messages -->
    <div class="container mt-3">
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ msg }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Main Dynamic Content -->
    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <!-- Footer -->
<footer class="bg-white text-center py-4 border-top mt-auto shadow-sm">
    <div class="container">
        <p class="mb-1 text-dark fw-semibold">
            &copy; 2026 <span class="text-teal" style="color: #0d9488;">DocCare Portal</span>. All Rights Reserved.
        </p>
        <p class="text-muted small mb-2">
            Designed & Developed by <strong class="text-dark">Maaz Usmani</strong>
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="https://github.com/maaz-usmani-cse" target="_blank" class="text-secondary text-decoration-none small">
                <i class="bi bi-github me-1"></i>GitHub
            </a>
            <span class="text-muted">|</span>
            <a href="https://www.linkedin.com/in/maaz-usmani-cse/?isSelfProfile=true" target="_blank" class="text-secondary text-decoration-none small">
                <i class="bi bi-linkedin me-1"></i>LinkedIn
            </a>
        </div>
    </div>
</footer>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
